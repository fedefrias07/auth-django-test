{%extends 'base.html'%}

{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'tareas/css/tareas.css' %}">
{% endblock %}

{%block content%}


<div class="d-flex flex-column align-items-center justify-content-center font">

    <div class="d-flex flex-column align-items-center p-4 mt-4 fondo">

        <h1 class="text-center mb-3">CREAR TAREA</h1>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="d-flex flex-column justify-content-center align-items-center">

                    <label style="font-size: 20px;" class="mb-2" for=""><strong>Titulo  </strong></label>
                    <input class="mb-3" type="text" name="titulo" required>

                <button class="btn btn-primary" type="submit">Guardar</button>
            </div>

            
        </form>
    </div>

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} mt-3">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}

</div>

{%endblock%}
