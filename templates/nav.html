{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/estilos.css' %}">
{% endblock %}

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'index' %}">Logo</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
      aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">

      <!-- Menú izquierda -->
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" href="{% url 'index' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'contacto' %}">Contacto</a>
        </li>
      </ul>


      <div class="d-flex gap-2 ms-auto">
        {% if user.is_authenticated %}

        {% if request.resolver_match.url_name == 'cuenta' %}
        <a class="btn btn-danger" href="{% url 'autenticacion:logout'%}">Cerrar sesion</a>
        {% endif %}


        <a href="{% url 'cuenta'%}">
          {% if user.avatar %}
          <div>
            <img src="{{ user.avatar.url }}" alt="Avatar del usuario" class="avatar-nav">
          </div>
          {% else %}
          <img src="{% static 'img/cuenta.png' %}" alt="Avatar del usuario" height="40px">
          {% endif %}
        </a>




        {% else %}
        <a class="btn btn-primary" href="{% url 'autenticacion:login' %}">Iniciar sesión</a>
        <a class="btn btn-primary" href="{% url 'autenticacion:register' %}">Registrarse</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
